<!DOCTYPE html>
<html lang="en-US" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="How close are self-driving cars to human-level safety? Waymo, Tesla FSD and human drivers compared by miles between safety events." />
    <title>AVProgress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- BoardUI's type scale is drawn for Inter (with the optical-size axis) and JetBrains Mono. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Apply the saved theme before the first paint, so dark-mode visitors never see a white flash.
         The key and the light default match BoardUI's ThemeToggle. -->
    <script>
      (function () {
        try {
          document.documentElement.classList.toggle("dark", localStorage.getItem("boardui:theme") === "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
